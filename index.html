<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тёплый Уголок</title>
    <!-- Simple PWA & Apple Touch Icon setup -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2935/2935307.png">
    <meta name="theme-color" content="#1b1412">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        espresso: '#1b1412',
                        roast: '#2c221e',
                        latte: '#4a3b35',
                        cream: '#f5efe6',
                        warmSand: '#dcd0c0',
                        amberGlow: '#e3a857',
                    },
                    fontFamily: {
                        marcellus: ['Marcellus', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
            50% { transform: translateY(-15px) rotate(3deg); opacity: 0.6; }
        }
        .particle {
            position: absolute;
            background: rgba(227, 168, 87, 0.25);
            border-radius: 50%;
            pointer-events: none;
            animation: float-slow 8s infinite ease-in-out;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1b1412; }
        ::-webkit-scrollbar-thumb { background: #4a3b35; border-radius: 3px; }
    </style>
</head>
<body class="bg-espresso text-cream font-sans min-h-screen flex flex-col items-center justify-between relative overflow-x-hidden selection:bg-amberGlow/30">

    <!-- Ambient Particles -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
        <div class="particle w-2 h-2 top-1/4 left-1/6" style="animation-delay: 0s;"></div>
        <div class="particle w-3 h-3 top-1/3 right-1/4" style="animation-delay: 2s;"></div>
        <div class="particle w-1.5 h-1.5 bottom-1/3 left-1/3" style="animation-delay: 4s;"></div>
    </div>

    <!-- Header -->
    <header class="w-full max-w-md px-6 pt-6 pb-2 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-roast border border-warmSand/10 flex items-center justify-center shadow-inner text-amberGlow">
                <i class="fa-solid fa-seedling text-lg"></i>
            </div>
            <div>
                <h1 class="font-marcellus text-lg tracking-wider text-cream">Тёплый Уголок</h1>
                <p class="text-xs text-warmSand/60 tracking-wide">фраза на каждый день</p>
            </div>
        </div>

        <button onclick="openSettings()" class="w-10 h-10 rounded-full bg-roast/80 hover:bg-roast border border-warmSand/10 flex items-center justify-center text-warmSand hover:text-amberGlow transition-all shadow-md" title="Установка и меню">
            <i class="fa-solid fa-gear text-sm"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-md px-6 py-4 flex flex-col items-center z-10 flex-grow justify-center">

        <!-- Decorative Element -->
        <div class="relative my-3">
            <div class="absolute inset-0 bg-amberGlow/10 rounded-full blur-2xl"></div>
            <div class="relative z-10 w-20 h-20 bg-gradient-to-br from-roast to-espresso rounded-3xl border-2 border-warmSand/20 shadow-2xl flex flex-col items-center justify-center">
                <i class="fa-solid fa-mug-hot text-2xl text-amberGlow mb-0.5"></i>
            </div>
        </div>

        <!-- Quote Card -->
        <div class="w-full bg-roast/60 backdrop-blur-md border border-warmSand/15 rounded-3xl p-6 sm:p-8 shadow-2xl relative transition-all duration-500 mt-2">
            <div class="flex items-center justify-between mb-4">
                <span id="quoteCategory" class="text-xs uppercase tracking-widest text-warmSand/70 font-medium px-2.5 py-1 rounded-md bg-espresso/50 border border-warmSand/10">Умиротворение</span>
                <span id="quoteVibe" class="text-xs italic text-warmSand/50 font-marcellus">атмосфера дня</span>
            </div>

            <div class="min-h-[110px] flex items-center justify-center my-2">
                <p id="quoteText" class="font-marcellus text-lg sm:text-xl text-center text-cream leading-relaxed font-light">
                    <!-- Loaded dynamically -->
                </p>
            </div>

            <div class="text-center mt-3 mb-5">
                <span id="quoteAuthor" class="text-xs text-amberGlow/80 font-medium tracking-wide"></span>
            </div>

            <div class="space-y-3 pt-4 border-t border-warmSand/10">
                <button onclick="copyQuote()" class="w-full flex items-center justify-center space-x-2 text-warmSand/90 hover:text-amberGlow transition-colors text-xs py-2.5 px-4 rounded-xl bg-espresso/60 border border-warmSand/10 shadow-inner">
                    <i class="fa-regular fa-copy text-sm"></i>
                    <span>Скопировать фразу</span>
                </button>

                <div class="text-center pt-1">
                    <span class="text-[11px] text-warmSand/50 flex items-center justify-center space-x-1.5">
                        <i class="fa-regular fa-clock text-amberGlow text-xs"></i>
                        <span>Новая фраза через: <strong id="countdown" class="text-warmSand font-semibold tracking-wider">00:00:00</strong></span>
                    </span>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer Space Filler -->
    <footer class="w-full max-w-md px-6 py-2 z-10 text-center">
        <div class="text-[10px] text-warmSand/30 tracking-wider">
            Создано для души ✨
        </div>
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-espresso/85 backdrop-blur-sm z-50 flex items-center justify-center transition-opacity opacity-0 pointer-events-none duration-300 p-6">
        <div class="w-full max-w-md bg-roast border border-warmSand/15 rounded-3xl p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="settingsModalContent">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-warmSand/10">
                <h3 class="font-marcellus text-lg text-cream flex items-center space-x-2">
                    <i class="fa-solid fa-gear text-amberGlow text-sm"></i>
                    <span>Установка приложения</span>
                </h3>
                <button onclick="closeSettings()" class="w-8 h-8 rounded-full bg-espresso/60 flex items-center justify-center text-warmSand hover:text-cream">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="space-y-4 text-xs text-warmSand">
                <div class="bg-espresso/40 p-4 rounded-2xl border border-warmSand/10 space-y-2">
                    <div class="font-medium text-cream text-sm flex items-center space-x-2">
                        <i class="fa-solid fa-mobile-screen text-amberGlow"></i>
                        <span>Как установить на главный экран</span>
                    </div>
                    <p class="text-warmSand/75 leading-relaxed">
                        Нажмите на три точки в правом верхнем углу браузера и выберите <strong>«Добавить на главный экран»</strong>.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-roast border border-amberGlow/30 text-cream px-4 py-2.5 rounded-2xl shadow-2xl flex items-center space-x-2 text-xs tracking-wide opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i class="fa-solid fa-circle-check text-amberGlow"></i>
        <span id="toastText">Скопировано</span>
    </div>

    <!-- Script -->
    <script>
        const quotesPool = [
            { text: "Каждый новый шаг — это возможность переписать свою историю заново с чистого листа.", category: "Вдохновение", vibe: "момент силы", author: "— Путь вперёд" },
            { text: "Завари чашку чая, останови бег мыслей и позволь этому моменту просто принадлежать тебе.", category: "Умиротворение", vibe: "пауза в тишине", author: "— Забота о себе" },
            { text: "Иногда самый продуктивный выбор за весь день — это разрешить себе никуда не спешить.", category: "Мягкость", vibe: "отдых ума", author: "— Внутренний голос" },
            { text: "Твоя ценность не измеряется количеством выполненных задач. Ты важна сама по себе.", category: "Любовь к себе", vibe: "безусловное тепло", author: "— Личный свет" },
            { text: "Позволь маленьким радостям незаметно согревать твои будни, создавая уют внутри.", category: "Уют", vibe: "тёплые мелочи", author: "— Моменты покоя" },
            { text: "Внутри тебя всегда есть тихая гавань, куда можно вернуться в любую бурю.", category: "Гармония", vibe: "покой души", author: "— Тишина" },
            { text: "Не нужно бежать впереди времени. Всё, что действительно твоё, найдёт тебя в свой час.", category: "Доверие", vibe: "лёгкость дыхания", author: "— Мудрость дня" },
            { text: "Окутай себя заботой. Сегодня внешний мир вполне может подождать за закрытой дверью.", category: "Личное время", vibe: "безопасный кокон", author: "— Уединение" },
            { text: "Каждый день оставляет свой след. Пусть сегодня этот след будет светлым и добрым.", category: "Настрой", vibe: "мягкий свет", author: "— Вдохновение" },
            { text: "Иногда чтобы услышать себя, нужно просто выключить шум вокруг и сделать глубокий вдох.", category: "Осознанность", vibe: "глубокий вдох", author: "— Баланс" },
            { text: "Твоя нежность к самой себе — это не слабость, а величайшая сила и опора.", category: "Сила духа", vibe: "сила тепла", author: "— Глубина" },
            { text: "Большие перемены вырастают из маленьких ежедневных шагов, сделанных с любовью.", category: "Развитие", vibe: "тихий рост", author: "— Путь к цели" },
            { text: "Позволь себе право на ошибку и право на отдых. Ты живой человек, а не идеальный механизм.", category: "Принятие", vibe: "свобода от давления", author: "— Доброта к себе" },
            { text: "Свет, который ты ищешь снаружи, на самом деле всегда горит внутри тебя.", category: "Вдохновение", vibe: "внутренний огонь", author: "— Истина" },
            { text: "Сделай паузу. Мир не рухнет, если ты уделишь несколько минут только себе.", category: "Отдых", vibe: "время для себя", author: "— Гармония" },
            { text: "Верь в тихую силу своих намерений. То, чему суждено сбыться, обязательно расцветёт.", category: "Вера", vibe: "тихое цветение", author: "— Надежда" },
            { text: "Пусть сегодняшний вечер принесет тебе долгожданное умиротворение и мягкое расслабление.", category: "Вечер", vibe: "уютный вечер", author: "— Покой" }
        ];

        function getDailyQuote() {
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
            let hash = 0;
            for (let i = 0; i < dateStr.length; i++) {
                hash = (hash << 5) - hash + dateStr.charCodeAt(i);
                hash |= 0;
            }
            const index = Math.abs(hash) % quotesPool.length;
            return quotesPool[index];
        }

        const todayQuote = getDailyQuote();

        function renderQuote() {
            document.getElementById('quoteCategory').textContent = todayQuote.category;
            document.getElementById('quoteVibe').textContent = todayQuote.vibe;
            document.getElementById('quoteText').textContent = `«${todayQuote.text}»`;
            document.getElementById('quoteAuthor').textContent = todayQuote.author;
        }

        function copyQuote() {
            const textToCopy = `«${todayQuote.text}»\n${todayQuote.author}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast('Цитата скопирована');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastText').textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function updateCountdown() {
            const now = new Date();
            const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
            const diff = tomorrow - now;

            const hours = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            const minutes = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            const seconds = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');

            document.getElementById('countdown').textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        function openSettings() {
            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsModalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeSettings() {
            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsModalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderQuote();
        });
    </script>
</body>
</html>
